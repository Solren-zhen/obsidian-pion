name: Bug report
description: Something in Pion does not work as expected
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please run `npm run verify` first and paste the output —
        it resolves a surprising share of issues.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, what you got.
    validations:
      required: true
  - type: dropdown
    id: mode
    attributes:
      label: Mode
      options: [Study mode, Coding mode, Both, Not applicable]
    validations:
      required: true
  - type: input
    id: pi-version
    attributes:
      label: pi version
      description: Output of `pi --version`
      placeholder: e.g. 0.84.3
    validations:
      required: true
  - type: input
    id: obsidian-version
    attributes:
      label: Obsidian version
      placeholder: e.g. 1.7.7
    validations:
      required: true
  - type: input
    id: plugin-version
    attributes:
      label: Pion version
      placeholder: e.g. 0.4.0
    validations:
      required: true
  - type: textarea
    id: verify-output
    attributes:
      label: Output of `npm run verify`
      render: shell
  - type: textarea
    id: console
    attributes:
      label: Developer console output
      description: Obsidian → Ctrl/Cmd+Shift+I → Console. Paste any errors.
      render: shell
